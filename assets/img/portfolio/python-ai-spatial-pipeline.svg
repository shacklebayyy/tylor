  <text x="380" y="122" fill="#8b949e" font-family="monospace" font-size="11">spatial_ai_evaluator.py</text>

  <g font-family="monospace" font-size="12">
    <text x="325" y="155" fill="#ff7b72">import</text>
    <text x="375" y="155" fill="#79c0ff">numpy</text>
    <text x="418" y="155" fill="#ff7b72">as</text>
    <text x="438" y="155" fill="#c9d1d9">np, </text>
    <text x="465" y="155" fill="#79c0ff">open3d</text>
    <text x="515" y="155" fill="#ff7b72">as</text>
    <text x="535" y="155" fill="#c9d1d9">o3d</text>

    <text x="325" y="180" fill="#d2a8ff">def</text>
    <text x="355" y="180" fill="#79c0ff"> evaluate_spatial_accuracy</text>
    <text x="545" y="180" fill="#c9d1d9">(ground_truth, ai_model):</text>

    <text x="345" y="205" fill="#8b949e"># Automated LiDAR cloud error assessment</text>
    <text x="345" y="230" fill="#c9d1d9">residuals = np.linalg.norm(ground_truth - ai_model, axis=1)</text>

    <text x="345" y="255" fill="#ff7b72">if</text>
    <text x="365" y="255" fill="#c9d1d9">np.mean(residuals) &lt; </text>
    <text x="505" y="255" fill="#79c0ff">0.02</text>
    <text x="535" y="255" fill="#c9d1d9">:</text>

    <text x="365" y="280" fill="#7ee787">return</text>
    <text x="415" y="280" fill="#a5d6ff">"PASSED: Visual &amp; Geometric Integrity Verified"</text>

    <text x="345" y="305" fill="#ff7b72">return</text>
    <text x="395" y="305" fill="#ffa657">generate_structured_technical_feedback(residuals)</text>

    <rect x="320" y="325" width="415" height="60" rx="6" fill="#161b22" stroke="#10b981" stroke-width="1" />
    <text x="335" y="348" fill="#10b981" font-size="11">[EVALUATION EXECUTION] Complete: 4,820 assets audited.</text>
    <text x="335" y="368" fill="#58a6ff" font-size="11">Result: 98.8% compliance with engineering specifications.</text>
  </g>

