<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad4)" />
  <circle cx="700" cy="500" r="220" fill="#06b6d4" opacity="0.08" />

  <!-- Navigation Header -->
  <rect x="30" y="30" width="740" height="50" rx="8" fill="#1c2541" stroke="#3a506b" stroke-width="1" />
  <text x="50" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">OMBULABS | Production Client ML Model Evaluation &amp; Bias Audit</text>
  <rect x="590" y="42" width="160" height="26" rx="13" fill="url(#cyanGlow)" />
  <text x="670" y="59" fill="#0b1329" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">CLIENT AUDIT</text>

  <!-- Metric 1: Bias Detection -->
  <rect x="30" y="100" width="230" height="130" rx="10" fill="#1c2541" stroke="#3a506b" stroke-width="1" />
  <text x="50" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">BIAS DETECTION AUDIT</text>
  <text x="50" y="175" fill="#10b981" font-family="system-ui, sans-serif" font-size="38" font-weight="800">CLEAN</text>
  <text x="50" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Demographic Parity Verified</text>

  <!-- Metric 2: Baseline vs Fine-tuned -->
  <rect x="285" y="100" width="230" height="130" rx="10" fill="#1c2541" stroke="#3a506b" stroke-width="1" />
  <text x="305" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">FINE-TUNING GAIN</text>
  <text x="305" y="175" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="38" font-weight="800">+18.4%</text>
  <text x="305" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">vs Client Baseline Metrics</text>

  <!-- Metric 3: Framework Status -->
  <rect x="540" y="100" width="230" height="130" rx="10" fill="#1c2541" stroke="#3a506b" stroke-width="1" />
  <text x="560" y="130" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PROMPT OPTIMIZATION</text>
  <text x="560" y="175" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="38" font-weight="800">ACTIVE</text>
  <text x="560" y="202" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Quality Assessment Framework</text>

  <!-- Main Graph Panel -->
  <rect x="30" y="250" width="740" height="310" rx="10" fill="#1c2541" stroke="#3a506b" stroke-width="1" />
  <text x="50" y="285" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Real-World Model Performance vs Baseline Metrics (OmbuLabs 2023-2024)</text>

  <!-- Graph Axis Lines -->
  <line x1="70" y1="320" x2="70" y2="500" stroke="#3a506b" stroke-width="2" />
  <line x1="70" y1="500" x2="730" y2="500" stroke="#3a506b" stroke-width="2" />

  <!-- Grid lines -->
  <line x1="70" y1="360" x2="730" y2="360" stroke="#3a506b" stroke-dasharray="4,4" stroke-width="1" opacity="0.4" />
  <line x1="70" y1="410" x2="730" y2="410" stroke="#3a506b" stroke-dasharray="4,4" stroke-width="1" opacity="0.4" />
  <line x1="70" y1="460" x2="730" y2="460" stroke="#3a506b" stroke-dasharray="4,4" stroke-width="1" opacity="0.4" />

  <!-- Polyline Baseline (Orange) -->
  <polyline points="70,470 180,450 290,460 400,430 510,440 620,420 730,410" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4" />
  <text x="700" y="400" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Baseline</text>

  <!-- Polyline Optimized (Cyan Glow) -->
  <polyline points="70,440 180,390 290,360 400,340 510,330 620,320 730,310" fill="none" stroke="#06b6d4" stroke-width="4" />
  <circle cx="730" cy="310" r="6" fill="#06b6d4" />
  <text x="680" y="295" fill="#06b6d4" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Optimized (+18.4%)</text>

  <!-- Footer Tag -->
  <rect x="50" y="520" width="670" height="28" rx="6" fill="#0b1329" />
  <text x="65" y="539" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Lead Evaluator: <tspan fill="#ffffff" font-weight="600">Richard Benson</tspan> | Organization: <tspan fill="#06b6d4" font-weight="600">OmbuLabs (Philadelphia, PA)</tspan> | Production Client Models</text>
</svg>
