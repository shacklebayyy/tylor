<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061d12" />
      <stop offset="100%" stop-color="#112a1b" />
    </linearGradient>
    <linearGradient id="duoGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58cc02" />
      <stop offset="100%" stop-color="#2bde02" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad5)" />
  <circle cx="700" cy="100" r="220" fill="#58cc02" opacity="0.08" />

  <!-- Navigation Header -->
  <rect x="30" y="30" width="740" height="50" rx="8" fill="#143823" stroke="#235c39" stroke-width="1" />
  <text x="50" y="60" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="600">DUOLINGO | Software Engineering &amp; Microservices Architecture</text>
  <rect x="580" y="42" width="170" height="26" rx="13" fill="url(#duoGreen)" />
  <text x="665" y="59" fill="#061d12" font-family="system-ui, sans-serif" font-size="11" font-weight="900" text-anchor="middle">CORE INFRASTRUCTURE</text>

  <!-- Metric 1: Code Coverage -->
  <rect x="30" y="100" width="230" height="130" rx="10" fill="#143823" stroke="#235c39" stroke-width="1" />
  <text x="50" y="130" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">CODE COVERAGE</text>
  <text x="50" y="175" fill="#58cc02" font-family="system-ui, sans-serif" font-size="38" font-weight="900">92%</text>
  <text x="50" y="202" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="12">Automated Test Suites</text>

  <!-- Metric 2: Bug Reduction -->
  <rect x="285" y="100" width="230" height="130" rx="10" fill="#143823" stroke="#235c39" stroke-width="1" />
  <text x="305" y="130" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">PRODUCTION BUGS</text>
  <text x="305" y="175" fill="#34d399" font-family="system-ui, sans-serif" font-size="38" font-weight="900">-34%</text>
  <text x="305" y="202" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="12">Reduced Bug Rate</text>

  <!-- Metric 3: Latency & Growth -->
  <rect x="540" y="100" width="230" height="130" rx="10" fill="#143823" stroke="#235c39" stroke-width="1" />
  <text x="560" y="130" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12" font-weight="600">API LATENCY OPTIMIZED</text>
  <text x="560" y="175" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="38" font-weight="900">40%</text>
  <text x="560" y="202" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="12">Supported 2x User Growth</text>

  <!-- Architecture Panel -->
  <rect x="30" y="250" width="740" height="310" rx="10" fill="#143823" stroke="#235c39" stroke-width="1" />
  <text x="50" y="285" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">Microservices Architecture &amp; Team Leadership (2015 – 2022)</text>

  <!-- Microservice Node Diagrams -->
  <!-- Node 1: API Gateway -->
  <rect x="60" y="320" width="170" height="90" rx="8" fill="#061d12" stroke="#58cc02" stroke-width="2" />
  <text x="145" y="355" fill="#58cc02" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">API Gateway</text>
  <text x="145" y="380" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Python &amp; Node.js</text>

  <!-- Connectors -->
  <line x1="230" y1="365" x2="310" y2="365" stroke="#58cc02" stroke-width="2" />

  <!-- Node 2: Core Engine -->
  <rect x="310" y="320" width="180" height="90" rx="8" fill="#061d12" stroke="#34d399" stroke-width="2" />
  <text x="400" y="355" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Learning Engine</text>
  <text x="400" y="380" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Millions of Active Users</text>

  <!-- Connectors -->
  <line x1="490" y1="365" x2="570" y2="365" stroke="#34d399" stroke-width="2" />

  <!-- Node 3: Test Automation -->
  <rect x="570" y="320" width="180" height="90" rx="8" fill="#061d12" stroke="#38bdf8" stroke-width="2" />
  <text x="660" y="355" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">PyTest Test Suite</text>
  <text x="660" y="380" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">92% Coverage Achieved</text>

  <!-- Highlights Box -->
  <rect x="60" y="440" width="690" height="60" rx="6" fill="#061d12" stroke="#235c39" stroke-width="1" />
  <text x="80" y="468" fill="#58cc02" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Infrastructure Leadership:</text>
  <text x="240" y="468" fill="#d1fae5" font-family="system-ui, sans-serif" font-size="12">Led team of 6 engineers on core infrastructure; mentored 4 junior engineers.</text>

  <!-- Footer Tag -->
  <rect x="50" y="520" width="670" height="28" rx="6" fill="#061d12" />
  <text x="65" y="539" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11">Software Engineer: <tspan fill="#ffffff" font-weight="600">Richard Benson</tspan> | Company: <tspan fill="#58cc02" font-weight="600">Duolingo (Pittsburgh, PA)</tspan> | 2015 – 2022</text>
</svg>
