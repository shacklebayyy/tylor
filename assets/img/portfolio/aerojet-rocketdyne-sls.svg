<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aeroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081224" />
      <stop offset="100%" stop-color="#0f203d" />
    </linearGradient>
    <linearGradient id="thrustGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="nasaOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#aeroBg)" />

  <rect x="30" y="20" width="740" height="44" rx="8" fill="#162a4d" stroke="#25457a" stroke-width="1" />
  <circle cx="50" cy="42" r="6" fill="#f97316" />
  <text x="66" y="46" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">AEROJET ROCKETDYNE | NASA SLS RS-25 PROPULSION HARDWARE</text>
  <rect x="615" y="29" width="140" height="26" rx="13" fill="url(#nasaOrange)" />
  <text x="685" y="46" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">AEROSPACE ENG</text>

  <rect x="30" y="78" width="240" height="392" rx="10" fill="#12223e" stroke="#1f3966" stroke-width="1" />
  <text x="48" y="108" fill="#f97316" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="1">PROPULSION ENGINEERING</text>

  <rect x="48" y="122" width="204" height="66" rx="6" fill="#0a1426" />
  <text x="60" y="144" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">RS-25 Vacuum Thrust</text>
  <text x="60" y="174" fill="#f97316" font-family="system-ui, sans-serif" font-size="24" font-weight="900">512,000 <tspan font-size="12" font-weight="600" fill="#94a3b8">lbf</tspan></text>

  <rect x="48" y="198" width="204" height="66" rx="6" fill="#0a1426" />
  <text x="60" y="220" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Chamber Pressure</text>
  <text x="60" y="250" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="24" font-weight="900">3,000 <tspan font-size="12" font-weight="600" fill="#94a3b8">psia</tspan></text>

  <text x="48" y="290" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Technical Responsibilities</text>
