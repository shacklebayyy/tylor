  <text x="48" y="335" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Combustion Device Hardware</text>
  <text x="48" y="355" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Engineering Spec Analysis</text>
  <text x="48" y="375" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">• Cross-Functional Flight Reviews</text>

  <rect x="48" y="398" width="204" height="56" rx="6" fill="#19325c" stroke="#f97316" stroke-width="1" />
  <text x="60" y="422" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">ENGINEERING LEADERSHIP</text>
  <text x="60" y="442" fill="#f97316" font-family="system-ui, sans-serif" font-size="11">Mechanical &amp; Aerospace Systems</text>

  <rect x="285" y="78" width="485" height="392" rx="10" fill="#12223e" stroke="#1f3966" stroke-width="1" />

  <g stroke="#38bdf8" stroke-width="1.5" fill="none">
    <rect x="480" y="105" width="95" height="50" rx="6" fill="#0a1426" stroke="#60a5fa" />
