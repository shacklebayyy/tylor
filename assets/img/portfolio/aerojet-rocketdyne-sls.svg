    <text x="527" y="185" fill="#f97316" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">COMBUSTION</text>

    <path d="M 510 205 Q 460 270 410 350 L 645 350 Q 595 270 545 205 Z" fill="#0a1426" stroke="#60a5fa" stroke-width="2" />

    <path d="M 430 350 Q 470 280 515 205" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    <path d="M 460 350 Q 490 285 522 205" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    <path d="M 595 350 Q 565 285 532 205" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
    <path d="M 625 350 Q 585 280 540 205" stroke="#38bdf8" stroke-width="1" opacity="0.5" />
  </g>

  <polygon points="527,350 495,385 527,415 560,385" fill="url(#thrustGrad)" opacity="0.8" />
  <polygon points="527,410 505,435 527,455 550,435" fill="url(#thrustGrad)" opacity="0.6" />

  <rect x="305" y="105" width="160" height="65" rx="6" fill="#0a1426" stroke="#25457a" stroke-width="1" />
  <text x="317" y="125" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="10" font-weight="700">SPEC COMPLIANCE</text>
  <text x="317" y="142" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">NASA SLS Artemis Flight</text>
  <text x="317" y="158" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="600">✓ Tolerance ±0.0005 in</text>

  <rect x="305" y="418" width="445" height="36" rx="6" fill="#0a1426" />
  <text x="325" y="440" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Program: <tspan fill="#ffffff" font-weight="600">NASA Space Launch System (SLS)</tspan> | Hardware: <tspan fill="#f97316" font-weight="700">RS-25 Propulsion Units</tspan></text>
</svg>